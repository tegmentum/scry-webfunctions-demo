[package]
name = "protparam"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }

[package.metadata.component]
package = "tegmentum:scry-demo-protparam"

# Target the Stardog overlay world (stardog:webfunction/stardog-extension
# @0.3.0). protparam exposes multi-column output only, via the base
# property-function surface — no meaningful single-scalar filter form for
# four independent biochemical properties.
[package.metadata.component.target]
path = "../../../../wit/overlay"
world = "stardog-extension"

[package.metadata.component.target.dependencies]
"tegmentum:webfunction" = { path = "../../../../wit/base" }
